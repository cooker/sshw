<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sshw config</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #fff;
      --ink: #172033;
      --muted: #667085;
      --line: #dfe3e8;
      --soft: #f8fafc;
      --blue: #1769e0;
      --blue-soft: #eaf2ff;
      --amber: #a15c00;
      --red: #b42318;
      --green: #18794e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      color: var(--ink);
      padding: 7px 11px;
      cursor: pointer;
    }
    button:hover { border-color: #aab3c0; background: var(--soft); }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #b9d3ff;
      outline-offset: 1px;
      border-color: var(--blue);
    }
    button.primary { border-color: var(--blue); background: var(--blue); color: white; font-weight: 700; }
    button.primary:hover { background: #0e57bf; }
    button.danger { color: var(--red); }
    button.icon { min-width: 36px; padding: 6px; }
    button.link { border: 0; background: transparent; color: var(--blue); padding: 3px; min-height: 0; }
    .topbar {
      height: 68px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 20px;
      color: #fff;
      background: #101828;
      border-bottom: 1px solid #273142;
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 220px; }
    .mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #276ee8;
      color: white;
      font: 800 16px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .brand strong { display: block; font-size: 16px; }
    .brand small { color: #aeb9ca; }
    .file {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      color: #cbd5e1;
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .save-area { display: flex; align-items: center; gap: 10px; }
    .locale-select {
      width: auto;
      min-height: 34px;
      border-color: #475467;
      background: #1d2939;
      color: #fff;
      padding-block: 5px;
    }
    .save-state { color: #cbd5e1; font-size: 12px; white-space: nowrap; }
    .save-state.dirty { color: #ffca75; }
    .save-state.ok { color: #7ee2ad; }
    .save-state.error { color: #ff9b94; }
    .workspace {
      height: calc(100vh - 68px);
      display: grid;
      grid-template-columns: 250px minmax(320px, 390px) minmax(440px, 1fr);
      background: var(--panel);
    }
    .pane { min-width: 0; overflow: auto; border-right: 1px solid var(--line); }
    .pane:last-child { border-right: 0; }
    .pane-head {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      padding: 15px 16px;
    }
    .head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pane h2 { margin: 0; font-size: 14px; letter-spacing: .01em; }
    .count { color: var(--muted); font-size: 12px; font-weight: 500; }
    .group-tree, .server-list { padding: 10px; }
    .tree-row, .server-row {
      width: 100%;
      border-color: transparent;
      text-align: left;
      background: transparent;
    }
    .tree-row {
      display: grid;
      grid-template-columns: 20px minmax(0,1fr) auto;
      align-items: center;
      min-height: 38px;
      padding: 6px 8px;
    }
    .tree-row.active { background: var(--blue-soft); color: #0f55b7; }
    .tree-row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-count { color: var(--muted); font-size: 11px; }
    .search-wrap { position: relative; margin-top: 12px; }
    .search-wrap span { position: absolute; left: 11px; top: 9px; color: var(--muted); }
    .search-wrap input { padding-left: 32px; padding-right: 32px; }
    .search-wrap button { position: absolute; right: 3px; top: 3px; border: 0; min-height: 30px; padding: 3px 8px; background: transparent; }
    input, select {
      width: 100%;
      min-height: 38px;
      border: 1px solid #cfd6df;
      border-radius: 7px;
      background: white;
      color: var(--ink);
      padding: 8px 10px;
    }
    .scope { margin-top: 9px; color: var(--muted); font-size: 12px; }
    .server-list { display: grid; gap: 4px; }
    .server-row { padding: 10px; border-radius: 8px; }
    .server-row.active { border-color: #9fc2fa; background: var(--blue-soft); }
    .server-title { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
    .server-alias { color: var(--blue); font-size: 11px; font-weight: 600; }
    .target {
      margin-top: 4px;
      color: #344054;
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-wrap: anywhere;
    }
    .path { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .empty { margin: 12px; padding: 26px 18px; border: 1px dashed #cdd4dd; border-radius: 9px; color: var(--muted); text-align: center; }
    .editor-wrap { max-width: 920px; padding: 22px 24px 80px; }
    .editor-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
    .editor-header h1 { margin: 0; font-size: 23px; }
    .eyebrow { margin-bottom: 4px; color: var(--muted); font-size: 12px; }
    .editor-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    form { display: grid; gap: 24px; }
    fieldset { margin: 0; padding: 0; border: 0; }
    legend { width: 100%; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); font-weight: 750; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    label { display: grid; gap: 6px; color: #475467; font-size: 12px; font-weight: 650; }
    .span-2 { grid-column: 1 / -1; }
    .secret { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .subpanel { padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--soft); }
    .subpanel[hidden] { display: none; }
    .callback-list { display: grid; gap: 8px; }
    .callback-row { display: grid; grid-template-columns: minmax(0,1fr) 130px auto; gap: 8px; align-items: end; }
    .form-foot { display: flex; justify-content: space-between; gap: 10px; padding-top: 4px; }
    .status-line { min-height: 20px; margin: 8px 16px 0; color: var(--muted); font-size: 12px; }
    .status-line.error { color: var(--red); }
    .status-line.ok { color: var(--green); }
    kbd { border: 1px solid #667085; border-bottom-width: 2px; border-radius: 4px; padding: 1px 4px; color: #d0d5dd; font: 10px ui-monospace, monospace; }
    [hidden] { display: none !important; }
    @media (max-width: 1100px) {
      .workspace { grid-template-columns: 220px 320px minmax(390px,1fr); }
      .editor-wrap { padding-inline: 18px; }
    }
    @media (max-width: 780px) {
      .topbar { height: auto; min-height: 68px; flex-wrap: wrap; padding-block: 12px; gap: 10px; }
      .brand { min-width: auto; }
      .file { order: 3; flex-basis: 100%; }
      .workspace { height: auto; min-height: calc(100vh - 96px); grid-template-columns: 1fr; }
      .pane { max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
      .groups-pane { max-height: 310px; }
      .servers-pane { max-height: 480px; }
      .form-grid, .callback-row { grid-template-columns: 1fr; }
      .span-2 { grid-column: auto; }
      .editor-header { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="mark">&gt;_</div><div><strong>sshw config</strong><small data-i18n="app.subtitle">Server workspace</small></div></div>
    <div class="file" id="file-name" data-i18n="state.loadingConfig">Loading configuration…</div>
    <div class="save-area">
      <select class="locale-select" id="locale" data-i18n-aria-label="language.label">
        <option value="en">English</option>
        <option value="zh-CN">简体中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="vi">Tiếng Việt</option>
      </select>
      <span class="save-state" id="save-state" data-i18n="state.loading">Loading…</span>
      <button class="primary" id="save" type="button"><span data-i18n="action.save">Save</span> <kbd>⌘S</kbd></button>
    </div>
  </header>
  <main class="workspace">
    <aside class="pane groups-pane">
      <div class="pane-head">
        <div class="head-row"><h2 data-i18n="pane.groups">Groups</h2><button class="icon" id="add-group" type="button" data-i18n-title="action.addGroup" data-i18n-aria-label="action.addGroup">＋</button></div>
      </div>
      <div class="status-line" id="status" role="status" aria-live="polite"></div>
      <nav class="group-tree" id="group-tree" data-i18n-aria-label="a11y.serverGroups"></nav>
    </aside>
    <section class="pane servers-pane">
      <div class="pane-head">
        <div class="head-row"><h2 id="server-heading" data-i18n="pane.allServers">All servers</h2><button id="add-server" type="button">＋ <span data-i18n="entity.server">Server</span></button></div>
        <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="search.label" autocomplete="off"><button id="clear-search" type="button" data-i18n-title="search.clear" data-i18n-aria-label="search.clear">×</button></div>
        <div class="scope" id="scope-summary"></div>
      </div>
      <div class="server-list" id="server-list"></div>
    </section>
    <section class="pane editor-pane">
      <div class="empty" id="editor-empty" data-i18n="empty.editor">Select a server or group to manage it.</div>
      <div class="editor-wrap" id="group-editor" hidden>
        <div class="editor-header">
          <div><div class="eyebrow" data-i18n="entity.groupUpper">GROUP</div><h1 id="group-title" data-i18n="entity.group">Group</h1></div>
          <div class="editor-actions"><button id="add-subgroup" type="button">＋ <span data-i18n="entity.subgroup">Subgroup</span></button><button id="add-group-server" type="button">＋ <span data-i18n="entity.server">Server</span></button></div>
        </div>
        <form id="group-form">
          <fieldset><legend data-i18n="section.groupDetails">Group details</legend><div class="form-grid">
            <label><span data-i18n="field.name">Name</span><input name="group-name" required></label>
            <label><span data-i18n="field.parentGroup">Parent group</span><select name="group-parent"></select></label>
          </div></fieldset>
          <div class="form-foot"><button class="danger" id="delete-group" type="button" data-i18n="action.deleteGroup">Delete group…</button><button class="primary" id="apply-group" type="button" data-i18n="action.apply">Apply changes</button></div>
        </form>
      </div>
      <div class="editor-wrap" id="server-editor" hidden>
        <div class="editor-header">
          <div><div class="eyebrow" id="server-path" data-i18n="label.ungroupedUpper">UNGROUPED</div><h1 id="server-title" data-i18n="entity.server">Server</h1></div>
          <div class="editor-actions"><button id="duplicate-server" type="button" data-i18n="action.duplicate">Duplicate</button></div>
        </div>
        <form id="server-form">
          <fieldset><legend data-i18n="section.identity">Identity & connection</legend><div class="form-grid">
            <label><span data-i18n="field.name">Name</span><input name="name" required></label>
            <label><span data-i18n="field.alias">Alias</span><input name="alias"></label>
            <label><span data-i18n="field.host">Host</span><input name="host" required placeholder="server.example.com"></label>
            <label><span data-i18n="field.user">User</span><input name="user" placeholder="root"></label>
            <label><span data-i18n="field.port">Port</span><input name="port" type="number" min="0" max="65535" step="1" inputmode="numeric" placeholder="22"></label>
            <label><span data-i18n="field.group">Group</span><select name="parent"></select></label>
          </div></fieldset>
          <fieldset><legend data-i18n="section.authentication">Authentication</legend><div class="form-grid">
            <label><span data-i18n="field.keyPath">Key path</span><input name="keypath" placeholder="~/.ssh/id_rsa"></label>
            <label><span data-i18n="field.agentPath">Agent path</span><input name="agentpath"></label>
            <label><span data-i18n="field.passphrase">Passphrase</span><input class="secret" name="passphrase" type="password" autocomplete="new-password"></label>
            <label><span data-i18n="field.password">Password</span><input class="secret" name="password" type="password" autocomplete="new-password"></label>
          </div></fieldset>
          <fieldset>
            <div class="head-row"><legend data-i18n="section.jumpHost">Jump host</legend><button id="toggle-jump" type="button" data-i18n="action.addJumpHost">Add jump host</button></div>
            <div class="subpanel" id="jump-fields" hidden><div class="form-grid">
              <label><span data-i18n="field.name">Name</span><input name="jump-name"></label>
              <label><span data-i18n="field.host">Host</span><input name="jump-host"></label>
              <label><span data-i18n="field.user">User</span><input name="jump-user"></label>
              <label><span data-i18n="field.port">Port</span><input name="jump-port" type="number" min="0" max="65535" step="1" inputmode="numeric"></label>
              <label><span data-i18n="field.keyPath">Key path</span><input name="jump-keypath"></label>
              <label><span data-i18n="field.password">Password</span><input class="secret" name="jump-password" type="password" autocomplete="new-password"></label>
            </div></div>
          </fieldset>
          <fieldset>
            <div class="head-row"><legend data-i18n="section.callbacks">Callback commands</legend><button id="add-callback" type="button">＋ <span data-i18n="field.command">Command</span></button></div>
            <div class="callback-list" id="callbacks"></div>
          </fieldset>
          <div class="form-foot"><button class="danger" id="delete-server" type="button" data-i18n="action.deleteServer">Delete server…</button><button class="primary" id="apply-server" type="button" data-i18n="action.apply">Apply changes</button></div>
        </form>
      </div>
    </section>
  </main>

  </script>
  <script>
    const i18nCatalog = JSON.parse(document.getElementById("i18n-catalog").textContent);
    const supportedLocales = Object.keys(i18nCatalog);
    let currentLocale = "en";
    let lastNotice = null;

    function normalizeLocale(locale) {
      if (!locale) return null;
      if (supportedLocales.includes(locale)) return locale;
      const base = locale.toLowerCase().split("-")[0];
      if (base === "zh") return "zh-CN";
      return supportedLocales.find(item => item.toLowerCase() === base) || null;
    }
    function initialLocale() {
      try {
        const stored = normalizeLocale(localStorage.getItem("sshw.config.locale"));
        if (stored) return stored;
      } catch (_) {}
      for (const locale of navigator.languages || [navigator.language]) {
        const match = normalizeLocale(locale);
        if (match) return match;
      }
      return "en";
    }
    function t(key, values = {}) {
      const template = i18nCatalog[currentLocale][key] || i18nCatalog.en[key] || key;
      return template.replace(/\{(\w+)\}/g, (_, name) => values[name] === undefined ? "{" + name + "}" : String(values[name]));
    }
    function tp(key, count, values = {}) {
      const category = new Intl.PluralRules(currentLocale).select(count);
      const suffix = i18nCatalog[currentLocale][key + "." + category] ? category : "other";
      return t(key + "." + suffix, { ...values, count });
    }
    function translateStatic() {
      document.querySelectorAll("[data-i18n]").forEach(element => { element.textContent = t(element.dataset.i18n); });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(element => { element.placeholder = t(element.dataset.i18nPlaceholder); });
      document.querySelectorAll("[data-i18n-title]").forEach(element => { element.title = t(element.dataset.i18nTitle); });
      document.querySelectorAll("[data-i18n-aria-label]").forEach(element => { element.setAttribute("aria-label", t(element.dataset.i18nAriaLabel)); });
      document.documentElement.lang = currentLocale;
      document.title = t("app.title");
    }
    function setLocale(locale, persist = true) {
      currentLocale = normalizeLocale(locale) || "en";
      $("locale").value = currentLocale;
      if (persist) {
        try { localStorage.setItem("sshw.config.locale", currentLocale); } catch (_) {}
      }
      translateStatic();
      renderAll();
      if (selectedKind === "group" && selectedNode) {
        $("group-title").textContent = groupName(selectedNode);
        fillGroupSelect($("group-form").elements["group-parent"], refFor(selectedNode).parent, selectedNode);
      }
      if (selectedKind === "server" && selectedNode) {
        const ref = refFor(selectedNode);
        $("server-title").textContent = selectedNode.name || selectedNode.alias || selectedNode.host || t("entity.server");
        $("server-path").textContent = groupPath(ref.groups);
        fillGroupSelect($("server-form").elements.parent, ref.parent);
      }
      setJumpVisible(hasJump);
      setDirty(dirty);
      if (lastNotice) setMessage(t(lastNotice.key, lastNotice.values), lastNotice.type, true);
    }

    let nodes = [];
    let selectedGroup = null;
    let selectedNode = null;
    let selectedKind = "";
    let hasJump = false;
    let dirty = false;
    let saving = false;
    const $ = (id) => document.getElementById(id);

    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function isGroup(node) { return Array.isArray(node && node.children); }
    function blankServer() { return { name:"", alias:"", host:"", user:"", port:0, keypath:"", agentpath:"", passphrase:"", password:"", callbackShells:[], jump:[] }; }
    function blankGroup(name = "New group") { return { name, children:[] }; }
    function normalizeNode(raw) {
      const node = { ...blankServer(), ...(raw || {}) };
      node.port = Number(node.port || 0);
      node.callbackShells = Array.isArray(node.callbackShells) ? node.callbackShells.filter(Boolean).map(item => ({ ...item, delay:Number(item.delay || 0) })) : [];
      node.jump = Array.isArray(node.jump) ? node.jump.filter(Boolean).map(normalizeNode) : [];
      if (Array.isArray(raw && raw.children)) node.children = raw.children.filter(Boolean).map(normalizeNode);
      else delete node.children;
      return node;
    }
    function setMessage(message, type = "", preserveNotice = false) {
      if (!preserveNotice) lastNotice = null;
      $("status").textContent = message;
      $("status").className = "status-line " + type;
    }
    function notify(key, values = {}, type = "") {
      lastNotice = { key, values, type };
      setMessage(t(key, values), type, true);
    }
    function setDirty(value = true) {
      dirty = value;
      const state = $("save-state");
      state.textContent = saving ? t("state.saving") : dirty ? t("state.dirty") : t("state.saved");
      state.className = "save-state " + (saving ? "" : dirty ? "dirty" : "ok");
    }
    function fail(err) {
      setMessage(err.message || String(err), "error");
      $("save-state").textContent = t("state.saveFailed");
      $("save-state").className = "save-state error";
    }
    function readInteger(input, label, max = Number.MAX_SAFE_INTEGER) {
      if (input.validity.badInput || input.validity.stepMismatch || input.validity.rangeUnderflow || input.validity.rangeOverflow) throw new Error(t("validation.integer", { field: label, max }));
      const raw = input.value.trim();
      if (!raw) return 0;
      const value = Number(raw);
      if (!Number.isSafeInteger(value) || value < 0 || value > max) throw new Error(t("validation.integer", { field: label, max }));
      return value;
    }
    function walk(list = nodes, groups = [], parent = null, depth = 0, out = []) {
      list.forEach((node, index) => {
        const ref = { node, parent, list, index, depth, groups };
        out.push(ref);
        if (isGroup(node)) walk(node.children, groups.concat(node), node, depth + 1, out);
      });
      return out;
    }
    function refFor(node) { return walk().find(ref => ref.node === node) || null; }
    function groupRefs() { return walk().filter(ref => isGroup(ref.node)); }
    function serverRefs() { return walk().filter(ref => !isGroup(ref.node)); }
    function groupName(group) { return group ? (group.name || t("label.unnamedGroup")) : t("label.ungrouped"); }
    function groupPath(groups) { return groups.map(groupName).join(" / ") || t("label.ungrouped"); }
    function descendantServerCount(group) {
      const list = group ? group.children : nodes;
      let count = 0;
      list.forEach(node => { count += isGroup(node) ? descendantServerCount(node) : 1; });
      return count;
    }
    function containsGroup(root, candidate) {
      return root === candidate || (root.children || []).some(child => isGroup(child) && containsGroup(child, candidate));
    }
    function detach(node) {
      const ref = refFor(node);
      if (!ref) return;
      ref.list.splice(ref.index, 1);
    }
    function targetList(group) { return group ? group.children : nodes; }
    function moveNode(node, group) {
      if (isGroup(node) && group && containsGroup(node, group)) throw new Error(t("error.groupCycle"));
      const current = refFor(node);
      if ((current && current.parent) === group) return;
      detach(node);
      targetList(group).push(node);
    }
    function optionLabel(group) {
      const ref = refFor(group);
      return ref ? groupPath(ref.groups.concat(group)) : t("label.ungrouped");
    }
    function fillGroupSelect(select, value, excluded = null) {
      select.innerHTML = "";
      const root = document.createElement("option");
      root.value = "";
      root.textContent = t("label.root");
      select.appendChild(root);
      groupRefs().forEach(ref => {
        if (excluded && containsGroup(excluded, ref.node)) return;
        const option = document.createElement("option");
        option.value = String(groupRefs().findIndex(item => item.node === ref.node));
        option.textContent = groupPath(ref.groups.concat(ref.node));
        option._group = ref.node;
        select.appendChild(option);
      });
      const match = Array.from(select.options).find(option => option._group === value);
      select.value = match ? match.value : "";
    }
    function selectedOptionGroup(select) { return select.selectedOptions[0]._group || null; }

    function renderGroups() {
      const root = $("group-tree");
      root.innerHTML = "";
      const all = document.createElement("button");
      all.type = "button";
      all.className = "tree-row" + (selectedGroup === null ? " active" : "");
      const icon = document.createElement("span"); icon.textContent = "⌂";
      const label = document.createElement("span"); label.className = "label"; label.textContent = t("pane.allServers");
      const count = document.createElement("span"); count.className = "tree-count"; count.textContent = descendantServerCount(null);
      all.append(icon, label, count);
      all.addEventListener("click", () => selectGroup(null));
      root.appendChild(all);
      groupRefs().forEach(ref => {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "tree-row" + (selectedGroup === ref.node ? " active" : "");
        row.style.paddingLeft = (8 + ref.depth * 17) + "px";
        const folder = document.createElement("span"); folder.textContent = "▸";
        const name = document.createElement("span"); name.className = "label"; name.textContent = groupName(ref.node);
        const total = document.createElement("span"); total.className = "tree-count"; total.textContent = descendantServerCount(ref.node);
        row.append(folder, name, total);
        row.addEventListener("click", () => selectGroup(ref.node));
        root.appendChild(row);
      });
    }
    function queryMatches(ref, query) {
      const terms = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
      if (!terms.length) return true;
      const node = ref.node;
      const haystack = [node.name, node.alias, node.host, node.user, node.port, groupPath(ref.groups)].join(" ").toLowerCase();
      return terms.every(term => haystack.includes(term));
    }
    function inSelectedScope(ref) {
      return !selectedGroup || ref.groups.includes(selectedGroup);
    }
    function visibleServers() {
      const query = $("search").value;
      return serverRefs().filter(ref => inSelectedScope(ref) && queryMatches(ref, query));
    }
    function renderServers() {
      const root = $("server-list");
      root.innerHTML = "";
      const refs = visibleServers();
      $("server-heading").textContent = selectedGroup ? groupName(selectedGroup) : t("pane.allServers");
      $("scope-summary").textContent = tp(selectedGroup ? "scope.group" : "scope.all", refs.length);
      if (!refs.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = t($("search").value ? "empty.search" : "empty.scope");
        root.appendChild(empty);
        return;
      }
      refs.forEach(ref => {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "server-row" + (selectedNode === ref.node ? " active" : "");
        const title = document.createElement("div"); title.className = "server-title";
        const name = document.createElement("span"); name.textContent = ref.node.name || ref.node.alias || ref.node.host || t("label.unnamedServer");
        const alias = document.createElement("span"); alias.className = "server-alias"; alias.textContent = ref.node.alias ? "@" + ref.node.alias : "";
        title.append(name, alias);
        const target = document.createElement("div"); target.className = "target";
        target.textContent = (ref.node.user ? ref.node.user + "@" : "") + (ref.node.host || t("label.noHost")) + (ref.node.port ? ":" + ref.node.port : "");
        const path = document.createElement("div"); path.className = "path"; path.textContent = groupPath(ref.groups);
        row.append(title, target, path);
        row.addEventListener("click", () => selectServer(ref.node));
        root.appendChild(row);
      });
    }
    function renderAll() { renderGroups(); renderServers(); }
    function showEmpty() {
      selectedNode = null; selectedKind = "";
      $("editor-empty").hidden = false; $("group-editor").hidden = true; $("server-editor").hidden = true;
    }
    function selectGroup(group) {
      try { commitCurrent(false); } catch (err) { return fail(err); }
      selectedGroup = group;
      selectedNode = group;
      if (!group) { showEmpty(); renderAll(); return; }
      selectedKind = "group";
      $("editor-empty").hidden = true; $("group-editor").hidden = false; $("server-editor").hidden = true;
      $("group-title").textContent = groupName(group);
      $("group-form").elements["group-name"].value = group.name || "";
      fillGroupSelect($("group-form").elements["group-parent"], refFor(group).parent, group);
      renderAll();
    }
    function selectServer(server) {
      try { commitCurrent(false); } catch (err) { return fail(err); }
      selectedNode = server; selectedKind = "server";
      $("editor-empty").hidden = true; $("group-editor").hidden = true; $("server-editor").hidden = false;
      const ref = refFor(server);
      $("server-title").textContent = server.name || server.alias || server.host || t("entity.server");
      $("server-path").textContent = groupPath(ref.groups);
      const form = $("server-form");
      ["name","alias","host","user","port","keypath","agentpath","passphrase","password"].forEach(key => form.elements[key].value = server[key] || "");
      fillGroupSelect(form.elements.parent, ref.parent);
      hasJump = server.jump.length > 0;
      setJumpVisible(hasJump);
      const jump = server.jump[0] || blankServer();
      ["name","host","user","port","keypath","password"].forEach(key => form.elements["jump-" + key].value = jump[key] || "");
      renderCallbacks(server.callbackShells);
      renderAll();
    }
    function readServer() {
      const original = selectedNode;
      const server = clone(original);
      const form = $("server-form");
      ["name","alias","host","user","keypath","agentpath","passphrase","password"].forEach(key => server[key] = form.elements[key].value.trim());
      server.port = readInteger(form.elements.port, t("field.port"), 65535);
      if (hasJump) {
        const jump = server.jump[0] ? clone(server.jump[0]) : blankServer();
        ["name","host","user","keypath","password"].forEach(key => jump[key] = form.elements["jump-" + key].value.trim());
        jump.port = readInteger(form.elements["jump-port"], t("field.jumpPort"), 65535);
        server.jump = jump.host ? [jump].concat(server.jump.slice(1)) : server.jump.slice(1);
      } else server.jump = [];
      server.callbackShells = Array.from(document.querySelectorAll(".callback-row")).map(row => ({
        cmd: row.querySelector('[data-field="cmd"]').value.trim(),
        delay: readInteger(row.querySelector('[data-field="delay"]'), t("field.callbackDelay"))
      })).filter(item => item.cmd);
      return server;
    }
    function replaceObject(target, source) {
      Object.keys(target).forEach(key => delete target[key]);
      Object.assign(target, source);
    }
    function commitServer(message = true) {
      if (selectedKind !== "server" || !selectedNode) return;
      const form = $("server-form");
      if (!form.reportValidity()) throw new Error(t("validation.requiredServer"));
      const parent = selectedOptionGroup(form.elements.parent);
      const previousParent = refFor(selectedNode).parent;
      const previousValue = JSON.stringify(selectedNode);
      const updated = readServer();
      replaceObject(selectedNode, updated);
      moveNode(selectedNode, parent);
      if (previousValue !== JSON.stringify(selectedNode) || previousParent !== parent) setDirty();
      if (message) notify("message.serverApplied", {}, "ok");
      const ref = refFor(selectedNode);
      $("server-title").textContent = selectedNode.name || selectedNode.alias || selectedNode.host || t("entity.server");
      $("server-path").textContent = groupPath(ref.groups);
      renderAll();
    }
    function commitGroup(message = true) {
      if (selectedKind !== "group" || !selectedNode) return;
      const form = $("group-form");
      if (!form.reportValidity()) throw new Error(t("validation.requiredGroup"));
      const previousParent = refFor(selectedNode).parent;
      const previousName = selectedNode.name;
      const parent = selectedOptionGroup(form.elements["group-parent"]);
      selectedNode.name = form.elements["group-name"].value.trim();
      moveNode(selectedNode, parent);
      if (previousName !== selectedNode.name || previousParent !== parent) setDirty();
      if (message) notify("message.groupApplied", {}, "ok");
      $("group-title").textContent = groupName(selectedNode);
      renderAll();
    }
    function commitCurrent(message = false) {
      if (selectedKind === "server") commitServer(message);
      if (selectedKind === "group") commitGroup(message);
    }
    function addGroup(parent = selectedGroup) {
      try { commitCurrent(false); } catch (err) { return fail(err); }
      const group = blankGroup();
      targetList(parent).push(group);
      selectedGroup = parent;
      setDirty();
      selectGroup(group);
      $("group-form").elements["group-name"].select();
      notify("message.groupAdded", {}, "ok");
    }
    function addServer(parent = selectedGroup) {
      try { commitCurrent(false); } catch (err) { return fail(err); }
      const server = blankServer();
      targetList(parent).push(server);
      setDirty();
      selectServer(server);
      $("server-form").elements.name.focus();
      notify("message.serverAdded", {}, "ok");
    }
    function renderCallbacks(callbacks) {
      $("callbacks").innerHTML = "";
      (callbacks || []).forEach(addCallbackRow);
    }
    function addCallbackRow(callback = { cmd:"", delay:0 }) {
      const row = document.createElement("div"); row.className = "callback-row";
      const command = document.createElement("label");
      const commandLabel = document.createElement("span"); commandLabel.dataset.i18n = "field.command"; commandLabel.textContent = t("field.command"); command.appendChild(commandLabel);
      const commandInput = document.createElement("input"); commandInput.dataset.field = "cmd"; commandInput.value = callback.cmd || ""; command.appendChild(commandInput);
      const delay = document.createElement("label");
      const delayLabel = document.createElement("span"); delayLabel.dataset.i18n = "field.delay"; delayLabel.textContent = t("field.delay"); delay.appendChild(delayLabel);
      const delayInput = document.createElement("input"); delayInput.dataset.field = "delay"; delayInput.type = "number"; delayInput.min = "0"; delayInput.step = "1"; delayInput.inputMode = "numeric"; delayInput.value = callback.delay || ""; delay.appendChild(delayInput);
      const remove = document.createElement("button"); remove.type = "button"; remove.className = "danger"; remove.dataset.i18n = "action.remove"; remove.textContent = t("action.remove"); remove.addEventListener("click", () => row.remove());
      row.append(command, delay, remove); $("callbacks").appendChild(row);
    }
    function setJumpVisible(value) {
      hasJump = value;
      $("jump-fields").hidden = !value;
      $("toggle-jump").textContent = t(value ? "action.removeJumpHost" : "action.addJumpHost");
    }
    async function loadConfig() {
      const response = await fetch("/api/config");
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || t("error.load"));
      nodes = (data.nodes || []).filter(Boolean).map(normalizeNode);
      $("file-name").textContent = data.file;
      selectedGroup = null;
      showEmpty();
      setDirty(false);
      notify("message.loaded", {}, "ok");
      renderAll();
      $("search").focus();
    }
    async function saveConfig() {
      if (saving) return;
      commitCurrent(false);
      saving = true; setDirty(dirty);
      const submitted = JSON.stringify(nodes);
      try {
        const response = await fetch("/api/config", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ nodes }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || t("error.save"));
        dirty = JSON.stringify(nodes) !== submitted;
        notify("message.saved", {}, "ok");
        setDirty(dirty);
      } finally { saving = false; setDirty(dirty); }
    }

    $("search").addEventListener("input", renderServers);
    $("locale").addEventListener("change", event => setLocale(event.target.value));
    $("clear-search").addEventListener("click", () => { $("search").value = ""; renderServers(); $("search").focus(); });
    $("add-group").addEventListener("click", () => addGroup());
    $("add-subgroup").addEventListener("click", () => addGroup(selectedNode));
    $("add-server").addEventListener("click", () => addServer());
    $("add-group-server").addEventListener("click", () => addServer(selectedNode));
    $("apply-group").addEventListener("click", () => { try { commitGroup(true); } catch (err) { fail(err); } });
    $("apply-server").addEventListener("click", () => { try { commitServer(true); } catch (err) { fail(err); } });
    $("save").addEventListener("click", () => saveConfig().catch(fail));
    $("toggle-jump").addEventListener("click", () => setJumpVisible(!hasJump));
    $("add-callback").addEventListener("click", () => addCallbackRow());
    $("duplicate-server").addEventListener("click", () => {
      try {
        commitServer(false);
        const ref = refFor(selectedNode);
        const duplicate = clone(selectedNode);
        duplicate.name = (duplicate.name || duplicate.alias || "Server") + " copy";
        ref.list.splice(ref.index + 1, 0, duplicate);
        setDirty(); selectServer(duplicate); notify("message.duplicated", {}, "ok");
      } catch (err) { fail(err); }
    });
    $("delete-server").addEventListener("click", () => {
      if (!selectedNode || !confirm(t("confirm.deleteServer"))) return;
      detach(selectedNode); showEmpty(); setDirty(); renderAll(); notify("message.serverDeleted", {}, "ok");
    });
    $("delete-group").addEventListener("click", () => {
      if (!selectedNode) return;
      const servers = descendantServerCount(selectedNode);
      const subgroups = groupRefs().filter(ref => ref.groups.includes(selectedNode)).length;
      if (!confirm(t("confirm.deleteGroup", { name: groupName(selectedNode), servers, subgroups }))) return;
      detach(selectedNode);
      selectedGroup = null; showEmpty(); setDirty(); renderAll(); notify("message.groupDeleted", {}, "ok");
    });
    document.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") { event.preventDefault(); saveConfig().catch(fail); }
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); $("search").focus(); $("search").select(); }
      if (event.key === "Escape" && document.activeElement === $("search")) { $("search").value = ""; renderServers(); }
    });
    window.addEventListener("beforeunload", event => { if (dirty) { event.preventDefault(); event.returnValue = ""; } });
    currentLocale = initialLocale();
    $("locale").value = currentLocale;
    translateStatic();
    setJumpVisible(false);
    loadConfig().catch(fail);
  </script>
</body>
</html>
